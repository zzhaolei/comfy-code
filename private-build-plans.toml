[buildPlans.ComfyCode]
family = "Comfy Code"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
noLigation = true

[buildPlans.ComfyCode.namingOverride]
manufacturer = "zzhaolei"
description = "Comfy Code is a custom build of Iosevka, a monospace font family for programming."
urlVendor = "https://github.com/zzhaolei/comfy-code"

[buildPlans.ComfyCode.variants.design]
one = "base"
two = "straight-neck-serifless"
four = "closed-serifless"
five = "oblique-flat-serifless"
six = "open-contour"
seven = "bend-serifless"
eight = "crossing-asymmetric"
nine = "open-contour"
zero = "oval-long-dotted"
capital-d = "more-rounded-serifless"
capital-g = "toothless-corner-serifless-hookless"
capital-k = "symmetric-touching-serifless"
capital-m = "slanted-sides-hanging-serifless"
a = "double-storey-toothless-corner"
b = "toothless-corner-serifless"
d = "toothless-corner-serifless"
f = "flat-hook-serifless"
g = "single-storey-earless-corner"
i = "serifed-semi-tailed"
j = "flat-hook-serifed"
k = "symmetric-touching-serifless"
l = "serifed-semi-tailed"
m = "earless-corner-double-arch-short-leg-serifless"
n = "earless-corner-straight-serifless"
p = "earless-corner-serifless"
q = "earless-corner-straight-serifless"
r = "hookless-serifless"
t = "flat-hook-short-neck"
u = "toothless-rounded-serifless"
y = "straight-turn-serifless"
brace = "straight"
dollar = "open-cap"
guillemet = "straight"
number-sign = "slanted"
underscore = "low"

[buildPlans.ComfyCode.variants.italic]
a = "single-storey-earless-corner-tailed"
f = "flat-hook-tailed"

[buildPlans.ComfyCode.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.ComfyCode.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.ComfyCode.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.ComfyCode.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.ComfyCode.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.ComfyCode.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.ComfyCode.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
