[buildPlans.ComfyCode]
family = "Comfy Code"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
noLigation = true

[buildPlans.ComfyCode.namingOverride]
manufacturer = "zzhaolei"
description = "Comfy Code is a custom build of Iosevka, a monospace font family for programming."
urlVendor = "https://github.com/zzhaolei/comfy-code"

[buildPlans.ComfyCode.variants.design]
one = "base"
two = "straight-neck-serifless"
four = "closed-serifless"
five = "oblique-flat-serifless"
eight = "two-circles"
zero = "oval-long-dotted"
capital-d = "more-rounded-serifless"
capital-g = "toothless-rounded-serifless-hooked"
a = "double-storey-toothless-corner"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "single-storey-earless-corner"
i = "serifed-semi-tailed"
j = "flat-hook-serifed"
l = "serifed-semi-tailed"
m = "flat-top-short-leg-serifless"
r = "compact-serifless"
t = "flat-hook-short-neck"
y = "straight-turn-serifless"
asterisk = "penta-mid"
paren = "large-contour"
guillemet = "straight"
number-sign = "slanted"
percent = "rings-continuous-slash"

[buildPlans.ComfyCode.variants.italic]
a = "single-storey-flat-top-tailed"
d = "toothed-serifless"
f = "flat-hook-tailed-crossbar-at-x-height"
g = "single-storey-flat-top-serifless"
i = "serifed-semi-tailed"
j = "flat-hook-serifed"
k = "straight-serifless"
u = "toothed-serifless"
y = "straight-turn-serifless"

[buildPlans.ComfyCode.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.ComfyCode.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.ComfyCode.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
