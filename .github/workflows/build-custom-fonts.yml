name: Build Custom Iosevka Fonts

on:
  push:
    branches:
      - main
    paths:
      - "private-build-plans.toml"
      - "IOSEVKA_VERSION"
      - ".github/patches/**"
      - ".github/scripts/get-all-families-in-private-build-plan/**"
      - ".github/workflows/build-custom-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom-fonts-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Fonts and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Resolve Font Families
        id: families
        shell: bash
        run: |
          cd .github/scripts/get-all-families-in-private-build-plan
          npm install
          line="$(node ./index.mjs)"
          json="${line#fontFamilies=}"
          families="$(node -e 'const arr=JSON.parse(process.argv[1]); console.log(arr.join(" "));' "$json")"
          if [[ -z "$families" ]]; then
            echo "No build plans found in private-build-plans.toml" >&2
            exit 1
          fi
          echo "list=$families" >> "$GITHUB_OUTPUT"

      - name: Read Iosevka Version
        id: iosevka-version
        shell: bash
        run: |
          if [[ -f IOSEVKA_VERSION ]]; then
            version="$(tr -d ' \t\n\r' < IOSEVKA_VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout Iosevka Repository (pinned)
        if: steps.iosevka-version.outputs.version != ''
        uses: actions/checkout@v5
        with:
          repository: be5invis/iosevka
          path: iosevka
          ref: ${{ steps.iosevka-version.outputs.version }}

      - name: Checkout Iosevka Repository (default)
        if: steps.iosevka-version.outputs.version == ''
        uses: actions/checkout@v5
        with:
          repository: be5invis/iosevka
          path: iosevka

      - name: Copy Custom Build Plans
        shell: bash
        run: |
          cp private-build-plans.toml iosevka/private-build-plans.toml

      - name: Build Fonts
        shell: bash
        working-directory: iosevka
        run: |
          npm install
          for plan in ${{ steps.families.outputs.list }}; do
            npm run build -- ttf-unhinted::${plan}
          done

      - name: Prepare Release Zips
        shell: bash
        run: |
          set -euo pipefail
          families=(${{ steps.families.outputs.list }})

          rm -rf "Comfy Code Unhinted"
          mkdir -p "Comfy Code Unhinted"
          for plan in "${families[@]}"; do
            src="iosevka/dist/${plan}/TTF-Unhinted"
            if [[ ! -d "$src" ]]; then
              echo "Missing unhinted TTF output for ${plan}: ${src}" >&2
              exit 1
            fi
            cp -R "$src/." "Comfy Code Unhinted/"
          done
          zip -r "ComfyCode-unhinted.zip" "Comfy Code Unhinted"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate Specimen and Weight Images
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          FONT_ROOT = Path("Comfy Code Unhinted")
          OUTPUT_DIR = Path("asserts/image")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          ttf_files = sorted(FONT_ROOT.rglob("*.ttf"))
          if not ttf_files:
            raise SystemExit(f"No TTF files found in {FONT_ROOT}.")

          regular_files = [path for path in ttf_files if path.name.endswith("-Regular.ttf")]
          base_font = (
            min(regular_files, key=lambda path: (len(path.name), path.name))
            if regular_files
            else ttf_files[0]
          )
          family = base_font.name.split("-")[0]
          display_name = re.sub(r"(?<!^)([A-Z])", r" \1", family)

          def load_font(path: Path, size: int) -> ImageFont.FreeTypeFont:
            return ImageFont.truetype(str(path), size)

          def draw_centered(
            draw: ImageDraw.ImageDraw,
            text: str,
            y: int,
            font: ImageFont.FreeTypeFont,
            width: int,
          ) -> int:
            bbox = draw.textbbox((0, 0), text, font=font)
            text_width = bbox[2] - bbox[0]
            x = int((width - text_width) / 2)
            draw.text((x, y), text, font=font, fill="black")
            return int(y + font.size * 1.4)

          specimen_size = (1200, 700)
          specimen = Image.new("RGB", specimen_size, "white")
          specimen_draw = ImageDraw.Draw(specimen)

          title_font = load_font(base_font, 84)
          body_font = load_font(base_font, 52)
          y = 80
          y = draw_centered(specimen_draw, display_name, y, title_font, specimen_size[0])
          y += 20
          specimen_lines = [
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            "abcdefghijklmnopqrstuvwxyz",
            "0123456789",
            "!@#$%^&*()[]{}<>?/\\|+-=_;:,.\"'",
          ]
          for line in specimen_lines:
            y = draw_centered(specimen_draw, line, y, body_font, specimen_size[0])

          specimen_path = OUTPUT_DIR / "specimen.png"
          specimen.save(specimen_path)

          weight_size = (1600, 900)
          weight_image = Image.new("RGB", weight_size, "white")
          weight_draw = ImageDraw.Draw(weight_image)
          weight_title_font = load_font(base_font, 68)
          pangram = "A quick brown fox jumps over the lazy dog."

          preview_entries = [
            ("Light", f"{family}-Light.ttf"),
            ("Light Italic", f"{family}-LightItalic.ttf"),
            ("Regular", f"{family}-Regular.ttf"),
            ("Regular Italic", f"{family}-Italic.ttf"),
            ("Medium", f"{family}-Medium.ttf"),
            ("Medium Italic", f"{family}-MediumItalic.ttf"),
            ("Bold", f"{family}-Bold.ttf"),
            ("Bold Italic", f"{family}-BoldItalic.ttf"),
          ]
          fonts_by_name = {font.name: font for font in ttf_files}
          missing_fonts = [
            filename for _, filename in preview_entries if filename not in fonts_by_name
          ]
          if missing_fonts:
            raise SystemExit(
              f"Missing weight preview fonts: {', '.join(missing_fonts)}"
            )

          y = 70
          y = draw_centered(
            weight_draw, display_name, y, weight_title_font, weight_size[0]
          )
          y += 30
          for _, filename in preview_entries:
            sample_font = load_font(fonts_by_name[filename], 52)
            weight_draw.text((80, y), pangram, font=sample_font, fill="black")
            y += int(sample_font.size * 1.7)

          weight_path = OUTPUT_DIR / "weights.png"
          weight_image.save(weight_path)

          print(f"Saved {specimen_path} and {weight_path}")
          PY

      - name: Compute Next Version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          current="$(
            git tag --list 'v*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1
          )"
          if [[ -z "$current" ]]; then
            echo "next=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$current" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          bump() {
            local maj="$1"
            local min="$2"
            local pat="$3"
            # Carry over with base-10 normalization (supports minor/patch >= 10).
            pat=$((pat + 1))
            while (( pat >= 10 )); do
              pat=$((pat - 10))
              min=$((min + 1))
            done
            while (( min >= 10 )); do
              min=$((min - 10))
              maj=$((maj + 1))
            done
            printf '%s %s %s\n' "$maj" "$min" "$pat"
          }
          read -r major minor patch < <(bump "$major" "$minor" "$patch")
          next="v${major}.${minor}.${patch}"
          while git rev-parse -q --verify "refs/tags/${next}" >/dev/null; do
            read -r major minor patch < <(bump "$major" "$minor" "$patch")
            next="v${major}.${minor}.${patch}"
          done
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit Preview Images
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asserts/image
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update preview images for ${{ steps.version.outputs.next }}"
          git push
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          target_commitish: ${{ steps.commit.outputs.commit }}
          generate_release_notes: true
          files: |
            ComfyCode-unhinted.zip
