name: Check Iosevka Version

on:
  schedule:
    - cron: "0 11 * * 0-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: iosevka-version-check
  cancel-in-progress: false

jobs:
  check:
    name: Check for Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Latest Iosevka Release Tag
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              https://api.github.com/repos/be5invis/Iosevka/releases/latest \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])'
          )"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Iosevka release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read Current Version
        id: current
        shell: bash
        run: |
          if [[ -f IOSEVKA_VERSION ]]; then
            current="$(tr -d ' \t\n\r' < IOSEVKA_VERSION)"
          fi
          echo "tag=$current" >> "$GITHUB_OUTPUT"

      - name: Commit Version Update to Main
        id: update
        if: steps.latest.outputs.tag != steps.current.outputs.tag
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' "$LATEST_TAG" > IOSEVKA_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IOSEVKA_VERSION
          git commit -m "chore: bump Iosevka to $LATEST_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger the build's push event.
      - name: Trigger Font Build and Release
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh workflow run build-custom-fonts.yml --ref main
